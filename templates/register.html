{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="section narrow">
  <h2 class="section-title" style="font-size:2.2rem">Join Your Community</h2>
  <p class="section-sub">Create a citizen account to raise complaints and comment.</p>
  <div class="divider"></div>
  <div class="card form-card">
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label for="name">Full name</label>
      <input id="name" name="name" required maxlength="100" value="{{ request.form.get('name', '') }}">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required value="{{ request.form.get('email', '') }}">
      <label for="locality">Your locality / area</label>
      <input id="locality" name="locality" required maxlength="100" placeholder="e.g. Model Town" value="{{ request.form.get('locality', '') }}">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required minlength="6" autocomplete="new-password">
      <p class="hint">At least 6 characters.</p>
      <button class="btn solid" style="width:100%;margin-top:20px" type="submit">Create account</button>
    </form>
    <p class="hint" style="margin-top:16px">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</section>
{% endblock %}
